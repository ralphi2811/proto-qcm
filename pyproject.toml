[project]
name = "proto-qcm"
version = "0.1.0"
description = "Générateur de QCM imprimables + correction OMR par smartphone (POC)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "weasyprint>=62",
    "segno>=1.6",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "zxing-cpp>=2.2",
    "httpx>=0.27",
    "pypdfium2>=4.30",
    "python-dotenv>=1.0",
    "pillow>=10",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
